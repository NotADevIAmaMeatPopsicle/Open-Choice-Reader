[project]
name = "open-choice-reader-backend"
version = "0.1.0"
description = "Self-hosted document reader and local text-to-speech service."
authors = [
  { name = "Michael Griffin", email = "NotADevIAmaMeatPopsicle@users.noreply.github.com" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "piper-tts>=1.4.2,<2",
  "pwdlib[argon2]>=0.3,<1",
  "pypdf>=6.10,<7",
  "soundfile>=0.12,<1",
  "sqlalchemy>=2.0,<3",
  "trafilatura>=2.0,<3",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
all = [
  "faster-whisper>=1.1,<2",
  "kokoro-onnx>=0.4,<1",
  "qwen-tts>=0.1.1,<1",
]
dev = [
  "build>=1.2,<2",
  "pip-audit>=2.9,<3",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project.urls]
Homepage = "https://github.com/NotADevIAmaMeatPopsicle/Open-Choice-Reader"
Repository = "https://github.com/NotADevIAmaMeatPopsicle/Open-Choice-Reader.git"
Issues = "https://github.com/NotADevIAmaMeatPopsicle/Open-Choice-Reader/issues"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
