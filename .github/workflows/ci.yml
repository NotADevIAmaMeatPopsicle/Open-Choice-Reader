name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  public-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify public file allowlist
        run: python scripts/verify-public-tree.py
      - name: Verify documentation links
        run: python scripts/verify-doc-links.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Verify clean database migration
        working-directory: backend
        env:
          OPEN_CHOICE_READER_DATABASE_URL: sqlite:///./data/ci-migrations.db
        run: |
          python -m alembic upgrade head
          python -m alembic check
      - name: Lint backend
        working-directory: backend
        run: python -m ruff check app tests
      - name: Audit Python dependencies
        working-directory: backend
        run: python -m pip_audit . --progress-spinner off
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest -q
      - name: Build and validate Python package
        working-directory: backend
        run: |
          python -m build --outdir "$RUNNER_TEMP/open-choice-reader-packages"
          python -m twine check "$RUNNER_TEMP"/open-choice-reader-packages/*
          python ../scripts/verify-python-package.py "$RUNNER_TEMP/open-choice-reader-packages"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Test frontend
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Audit dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  browser-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test browser extension
        working-directory: browser-extension
        run: node --test tests/core.test.mjs
